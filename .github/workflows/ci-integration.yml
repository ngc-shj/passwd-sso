name: ci-integration

# Round 4 S11/T12 fix: authoritative integration-test gate for auth/DB-touching PRs.
# Runs `npm run test:integration` against a live Postgres service. Blocking this
# job's result is set via repo branch-protection `required_status_checks` (not
# declared in this file — verify post-merge via `gh api .../branches/main/protection`).

on:
  pull_request:
    paths:
      - 'src/lib/auth/**'
      - 'src/lib/prisma.ts'
      - 'src/lib/prisma/**'
      - 'src/lib/redis.ts'
      - 'src/lib/tenant-rls.ts'
      - 'src/lib/tenant-rls-grants.ts'
      - 'src/lib/tenant-rls-purpose.ts'
      - 'src/lib/db/**'
      # Constants the integration suite asserts against (e.g. the active
      # client-family cap); a constants-only PR must still run the real-DB proof.
      - 'src/lib/constants/**'
      # audit/** writes audit_outbox and is covered only by integration tests for
      # the invariant that the outbox openers use the un-proxied client — no
      # static gate can tell the two clients apart, so a PR touching only this
      # directory must still reach this job.
      - 'src/lib/audit/**'
      - 'src/lib/tenant-context.ts'
      - 'src/lib/tenant/**'
      - 'src/lib/mcp/**'
      - 'src/lib/vault/**'
      - 'src/lib/services/**'
      - 'src/workers/**'
      - 'src/__tests__/db-integration/**'
      - 'prisma/schema.prisma'
      - 'prisma/migrations/**'
      # T2: route handlers read/write tenant-scoped tables; a route-only PR must
      # still run the integration suite (RLS scoping + write-read format).
      - 'src/app/api/**'
      - 'src/lib/emergency-access/**'
      - 'src/lib/access-request/**'
      # C7: the offline operator CLI, tested from src/__tests__/db-integration/.
      - 'scripts/**'
      # A dependency bump (the pg driver, Prisma, the S3 client) changes what
      # these tests exercise; a change to this workflow changes how they run.
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ci-integration.yml'
      # jackson-probe: the Jackson images the repo references, and the
      # provider wiring whose security rests on what that probe measures.
      - 'docker-compose.yml'
      - 'infra/terraform/**'
      - 'src/auth.ts'
      - 'src/auth.config.ts'
      - 'src/app/\[locale\]/auth/signin/**'
      - 'scripts/probes/**'

permissions:
  # Round 4 S23 fix: principle of least privilege — only content read needed.
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          # Round 4 S22: ephemeral service-container credential — scoped to CI runner
          # localhost ONLY. DO NOT reuse in any real env.
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: passwd_test
          # Migration 20260413120000_convert_timestamp_to_timestamptz guards
          # against timezone-dependent USING clauses by requiring the server
          # timezone to be exactly 'UTC'. The default 'Etc/UTC' value used by
          # postgres:16 fails this guard. PGTZ sets the server timezone at
          # initdb time so the guard passes.
          PGTZ: UTC
          TZ: UTC
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=5

      # T1: real Redis so the session-revocation tombstone and admin-vault-reset
      # cross-tenant-session integration tests (skipIf(!REDIS_URL)) actually run
      # instead of silently skipping green.
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=5

    env:
      # T1: present so REDIS_URL-gated integration tests execute (see redis service).
      REDIS_URL: redis://localhost:6379
      # T1: the now-running session-cache tests derive the cache-key HMAC from
      # SHARE_MASTER_KEY (getMasterKeyByVersion(1) via getSessionCacheHmacKey),
      # so it must be present or cacheKey() throws and every cache op fails.
      # Ephemeral CI-only 64-hex value (service container destroyed per run).
      SHARE_MASTER_KEY: "1111111111111111111111111111111111111111111111111111111111111111"
      # Round 4 T19 fix: DATABASE_URL inline from service — no secrets.
      # Fork PRs run unchanged (no secret access required).
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/passwd_test
      # Names mirror docker-compose vocabulary so the password-by-role
      # mapping is consistent across the repo. Values match the
      # helpers.ts integration-test fallbacks (ephemeral CI credentials,
      # service container destroyed per run; port 5432 binds to runner
      # localhost only).
      PASSWD_APP_PASSWORD: passwd_app_pass
      PASSWD_OUTBOX_WORKER_PASSWORD: passwd_outbox_pass
      PASSWD_RETENTION_GC_WORKER_PASSWORD: passwd_retention_gc_pass
      PASSWD_ANCHOR_PUBLISHER_PASSWORD: passwd_anchor_publisher_pass
      # bootstrap-rds-roles.integration.test.ts T11 replays set-*-password.sh
      # through whichever psql it finds first: the host client, else the
      # compose db service. Pinned so a runner without the client is a red
      # rather than a silent change of path.
      SET_ROLE_PASSWORD_EXPECT_PSQL: "host"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Round 4 T31 fix: defensive `prisma generate` in case postinstall
      # doesn't run it (some npm configurations skip postinstall scripts).
      - name: Generate Prisma Client
        run: npx prisma generate

      # Round 4 T23 fix: use `migrate deploy` (idempotent, non-interactive) —
      # NOT `migrate dev` which is dev-only and may prompt on drift.
      # Matches precedent at ci.yml:270,337,423.
      - name: Apply database migrations
        run: npx prisma migrate deploy

      # GitHub Actions service containers do not mount initdb scripts, so the
      # `passwd_app` role (created by infra/postgres/initdb/02-create-app-role.sql
      # in dev) does not exist here. The `passwd_outbox_worker` role is created
      # by migration 20260412100001 but without a password. Bootstrap both
      # roles so the integration tests' role-specific connection strings
      # (helpers.ts:getConnectionString) can authenticate.
      #
      # Round 4 S22: passwords below are CI-only ephemeral credentials
      # (service container is destroyed per run; port 5432 binds to runner
      # localhost only). DO NOT reuse outside this CI runner. Values match
      # the dev fallback constants in 02-create-app-role.sql so the tests'
      # base→role substitution in helpers.ts works without additional env
      # vars. Tests still run as NOSUPERUSER/NOBYPASSRLS roles, so RLS
      # enforcement assertions remain valid.
      - name: Bootstrap application DB roles
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d passwd_test <<EOF
          -- Defense-in-depth: revoke default PUBLIC CREATE on the public schema
          -- (mirrors infra/postgres/initdb/02-create-app-role.sql:24).
          REVOKE CREATE ON SCHEMA public FROM PUBLIC;

          -- passwd_outbox_worker: created by migration without password; set it now.
          ALTER ROLE passwd_outbox_worker WITH LOGIN PASSWORD '${PASSWD_OUTBOX_WORKER_PASSWORD}';

          -- passwd_dcr_cleanup_worker: retired by migration 20261023010000 (NOLOGIN,
          -- no password, no grants); scripts/audit-db-grants.mjs asserts that, so it
          -- is deliberately NOT given a login here.

          -- passwd_retention_gc_worker: created by migration without password; set it now.
          ALTER ROLE passwd_retention_gc_worker WITH LOGIN PASSWORD '${PASSWD_RETENTION_GC_WORKER_PASSWORD}';

          -- passwd_anchor_publisher: created by migration without password; set it now.
          ALTER ROLE passwd_anchor_publisher WITH LOGIN PASSWORD '${PASSWD_ANCHOR_PUBLISHER_PASSWORD}';

          -- passwd_app: not created by any migration (lives in initdb only).
          -- Replicate the role + grants the integration tests rely on.
          DO \$\$ BEGIN
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'passwd_app') THEN
              CREATE ROLE passwd_app WITH LOGIN NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE PASSWORD '${PASSWD_APP_PASSWORD}';
            END IF;
          END \$\$;
          GRANT CONNECT ON DATABASE passwd_test TO passwd_app;
          GRANT USAGE ON SCHEMA public TO passwd_app;
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO passwd_app;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO passwd_app;
          GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO passwd_app;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT USAGE, SELECT ON SEQUENCES TO passwd_app;
          -- The migrations that create these routines ran before passwd_app
          -- existed here, so their IF EXISTS grants skipped it. The RLS policies
          -- call the rls_bypass_* functions for every reading role; the two
          -- SECURITY DEFINER audit routines are the app role's only write path
          -- to audit_logs (same set as bootstrap-rds-roles.mjs ROUTINE_EXECUTE).
          GRANT EXECUTE ON FUNCTION public.rls_bypass_enforced() TO passwd_app;
          GRANT EXECUTE ON FUNCTION public.rls_bypass_admits(text) TO passwd_app;
          GRANT EXECUTE ON FUNCTION public.audit_log_purge(uuid, timestamptz) TO passwd_app;
          GRANT EXECUTE ON PROCEDURE public.audit_log_tenant_migrate(uuid, uuid, uuid) TO passwd_app;
          EOF

      # The GRANT above is table-blind and runs AFTER `prisma migrate deploy`, so
      # it re-grants exactly what 20260522000200_audit_log_revoke_via_definer
      # revoked on audit_logs / audit_chain_anchors (C13 / OWASP A04-2). Left
      # alone, every integration run tested a database whose audit tables the app
      # role can rewrite — and the assertions that would have caught it were the
      # ones failing.
      #
      # Applied from the single declaration rather than spelled again here: a
      # fourth copy of the policy is how the first one came to be undone. See
      # scripts/checks/app-role-denied-privileges.json.
      - name: Re-apply the must-never-be-granted policy (post-migration)
        run: node scripts/bootstrap-rds-roles.mjs --denied-only
        env:
          MIGRATION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/passwd_test

      # MinIO stands in for S3 (audit-anchor-s3-destination.integration.test.ts,
      # which fails rather than skips without it). A step, not a service
      # container: a service cannot pass the `server /data` command. Same image
      # as docker-compose.override.yml, pinned by digest (minio/minio left Docker
      # Hub); /data is a tmpfs owned by the image's non-root user. The KMS key enables
      # SSE-S3 — without one MinIO answers 501 to the AES256 header the anchor
      # destination always sends; it is generated per run, so nothing is stored.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 127.0.0.1:9000:9000 \
            --tmpfs /data:uid=65532,gid=65532 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            -e MINIO_KMS_SECRET_KEY="ci-anchor-key:$(openssl rand -base64 32)" \
            cgr.dev/chainguard/minio@sha256:73297936408b731668ca0e835ac9add1a35cb6026a125c2f0cd476d9ef48222c \
            server /data
          for _ in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:9000/minio/health/ready; then
              echo "ANCHOR_TEST_S3_ENDPOINT=http://127.0.0.1:9000" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 1
          done
          docker logs minio
          echo "MinIO did not become ready within 30s" >&2
          exit 1

      - name: Run integration tests
        env:
          # The superuser, for the test harness: helpers.ts seeds and cleans up
          # through MIGRATION_DATABASE_URL.
          MIGRATION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/passwd_test
          # The application role, for the code under test: `@/lib/prisma` connects
          # with DATABASE_URL, and the job-level value is the superuser, which RLS
          # does not apply to. Every cell whose subject is a row RLS hides passed
          # there regardless of the code (audit-tenant-adjudicator round 6, T1).
          # This is the role local runs have always used via .env; files that
          # depend on it assert it with `assertRlsApplies`.
          DATABASE_URL: postgresql://passwd_app:passwd_app_pass@localhost:5432/passwd_test
        run: npm run test:integration

  # C1 (#742): a SAML sign-in must not complete through one Jackson connection's
  # client with another connection's IdP. The app's side is "no PKCE, each
  # provider exchanges with its own connection's credentials"; whether that
  # holds is decided by Jackson's token endpoint, so it is measured against
  # every Jackson version the repo references (docker-compose.yml, and the
  # terraform.tfvars.example ECR re-tags `v<x>` of upstream `<x>`). The list and
  # its digests are pinned here only; scripts/__tests__/jackson-probe-images.test.mjs
  # holds them to those files. The probe itself asserts that the server reports
  # the version its digest is listed under.
  jackson-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - jackson: '1.52.2'
            image: 'boxyhq/jackson:1.52.2@sha256:1d0b58424b1861520b85c4093191ea37dfde221f7ff5fddfe146e65269fd2826'
          - jackson: '1.42.0'
            image: 'boxyhq/jackson:1.42.0@sha256:90d91d80e5683250d9da72e057eac9e7484097dba4b6a46f14088dc189150bf6'
    env:
      # The probe's own runtime: it signs IdP responses with @boxyhq/saml20 and
      # mints IdP certificates with node-forge, which only the newer image ships
      # as standalone modules (1.42.0 bundles them into its Next.js chunks). It
      # plays the IdP and the app, never the server under test, so one image
      # serves every matrix entry; it is the docker-compose.yml entry above.
      PROBE_DRIVER_IMAGE: 'boxyhq/jackson:1.52.2@sha256:1d0b58424b1861520b85c4093191ea37dfde221f7ff5fddfe146e65269fd2826'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      # The token exchange runs through the repo's locked oauth4webapi (the copy
      # @auth/core resolves); the probe asserts its version against the lockfile.
      - name: Install dependencies
        run: npm ci

      # The matrix above is what this job measures; the drift test holds it to
      # the images docker-compose.yml and terraform.tfvars.example reference.
      # Run here as well as in app-ci, so a PR that changes only the matrix or
      # a tfvars re-tag cannot leave this job green on a list that has drifted.
      - name: Check the probe matrix against the referenced Jackson images
        run: npx vitest run scripts/__tests__/jackson-probe-images.test.mjs

      # Teardown is registered before anything is created, so a failed start or
      # probe still removes the server and network; the server log is printed on
      # any failure. Keys, API key and IdP certificates are generated per run;
      # Jackson's database is in memory.
      - name: Probe Jackson ${{ matrix.jackson }} connection binding
        env:
          JACKSON_IMAGE: ${{ matrix.image }}
          JACKSON_VERSION: ${{ matrix.jackson }}
        run: |
          env_file="$RUNNER_TEMP/jackson-probe.env"
          teardown() {
            rc=$?
            if [ "$rc" -ne 0 ]; then docker logs jackson-probe-server || true; fi
            docker rm -f jackson-probe-server >/dev/null 2>&1 || true
            docker network rm jackson-probe >/dev/null 2>&1 || true
            rm -f "$env_file"
            exit "$rc"
          }
          trap teardown EXIT
          docker run --rm --entrypoint node -v "$PWD/scripts/probes:/probe:ro" \
            "$PROBE_DRIVER_IMAGE" /probe/jackson-connection-binding.mjs env > "$env_file"
          docker network create jackson-probe >/dev/null
          docker run -d --name jackson-probe-server --network jackson-probe --network-alias jackson \
            --env-file "$env_file" \
            -e DB_ENGINE=mem \
            -e EXTERNAL_URL=http://jackson:5225 \
            -e NEXTAUTH_URL=http://jackson:5225 \
            "$JACKSON_IMAGE" >/dev/null
          docker run --rm --network jackson-probe --entrypoint node --env-file "$env_file" \
            -e JACKSON_URL=http://jackson:5225 \
            -e EXPECTED_JACKSON_VERSION="$JACKSON_VERSION" \
            -e REPO_ROOT=/repo \
            -v "$PWD/scripts/probes:/probe:ro" \
            -v "$PWD/node_modules:/repo/node_modules:ro" \
            -v "$PWD/package-lock.json:/repo/package-lock.json:ro" \
            "$PROBE_DRIVER_IMAGE" /probe/jackson-connection-binding.mjs run
