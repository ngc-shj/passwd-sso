[SERVICE]
    Flush         5
    Daemon        Off
    Log_Level     info
    Parsers_File  /fluent-bit/etc/parsers.conf
    HTTP_Server   On
    HTTP_Listen   0.0.0.0
    HTTP_Port     2020

[INPUT]
    Name          forward
    Listen        0.0.0.0
    Port          24224
    Tag           app.*

# Step 1: Parse JSON from Docker fluentd log driver.
# On success, top-level JSON fields (incl. _logType) are promoted.
# On failure, the record passes through without _logType.
[FILTER]
    Name          parser
    Match         app.*
    Key_Name      log
    Parser        docker_json
    Reserve_Data  On

# Step 2: Keep only structured log records, and drop the one we do not forward.
#
# Keyed on `_app`, which BOTH pino instances set (the app logger in
# src/lib/logger.ts and the audit logger in src/lib/audit/audit-logger.ts).
# Non-JSON lines and unrecognized JSON lines have no `_app` and are excluded.
#
# It used to key on `_logType ^(audit|app)$`, which forced two things this
# no longer needs: every new worker alert namespace had to be added to the
# alternation here (a second list to keep in step with the alert-namespaces
# marker in docs/operations/alerts.md), and the app logger had to claim
# `_logType: "app"` in its base — which collided with the per-line alert
# identifier and emitted the key twice. `_logType` is now single-valued and
# means one thing: the alert identifier.
[FILTER]
    Name          grep
    Match         app.*
    Regex         _app .

# `audit-dead-letter` is deliberately NOT forwarded by default. Widening the
# filter to include it is an operator decision, not a default: the record
# carries whatever the failing caller passed, including error text. See the
# "Note on the forwarder" under `audit-dead-letter` in
# docs/operations/alerts.md before removing this.
#
# The exclusion is harmless for the two database-unreachable reasons — nothing
# durable could have been written in that state anyway. It is NOT harmless for
# `invalid_user_id`, which fires with a HEALTHY database.
#
# And it is worse HERE than elsewhere: this file is mounted by
# docker-compose.logging.yml, which switches the app service to the fluentd
# driver — replacing json-file rather than adding to it. So in the one deployment
# that loads this config there is no local copy to fall back on, and the Exclude
# below destroys the record. Without the overlay the line at least survives in
# container logs capped at 20m x 5. A known gap, recorded in the runbook; this
# comment used to say the exclusion "no longer hides the only copy of an
# unattributable event", which is true of the reason that claim was written about
# and not of this one.
#
# `_logType: "audit-refused"` MUST NOT be excluded. It is the only signal for a
# control that writes no audit row anywhere — an emit refused because it was
# issued inside an RLS context — so an Exclude covering it, or a narrowing of the
# `_app` keep-filter above, silences it completely with nothing else to notice.
[FILTER]
    Name          grep
    Match         app.*
    Exclude       _logType ^audit-dead-letter$

# ─── OUTPUT DESTINATIONS ───────────────────────────────
# Uncomment the output(s) you want. Multiple outputs are supported.

# --- Default: stdout (for testing/debugging) ---
[OUTPUT]
    Name          stdout
    Match         app.*
    Format        json_lines

