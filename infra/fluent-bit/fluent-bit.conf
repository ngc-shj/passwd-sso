[SERVICE]
    Flush         5
    Daemon        Off
    Log_Level     info
    Parsers_File  /fluent-bit/etc/parsers.conf
    HTTP_Server   On
    HTTP_Listen   0.0.0.0
    HTTP_Port     2020

[INPUT]
    Name          forward
    Listen        0.0.0.0
    Port          24224
    Tag           app.*

# Step 1: Parse JSON from Docker fluentd log driver.
# On success, top-level JSON fields (incl. _logType) are promoted.
# On failure, the record passes through without _logType.
[FILTER]
    Name          parser
    Match         app.*
    Key_Name      log
    Parser        docker_json
    Reserve_Data  On

# Step 2: Keep only structured log records (audit + app + worker alerts).
# Non-JSON lines and unrecognized JSON lines lack _logType,
# so they are naturally excluded by this grep filter.
#
# The worker namespaces are the ones declared in the alert-namespaces marker in
# docs/operations/alerts.md. Without them this filter dropped every worker error
# log BEFORE any output plugin saw it, so an operator who followed that document
# while reusing this config got zero matches and no signal that the records had
# been discarded — the same manufactured-assurance shape the _logType rule
# exists to close. (Keep this alternation in step with that marker; the two are
# the same list, and only the marker is machine-checked.)
#
# NOTE on duplicate keys: pino writes `_logType: "app"` from its `base` and the
# per-line value from the call site, so an alert record carries the key TWICE.
# Last-wins parsers (Go encoding/json, JSON.parse) yield the alert value, which
# is what this regex and the SIEM rules assume. A first-wins or
# reject-duplicates consumer sees "app" instead and matches nothing.
[FILTER]
    Name          grep
    Match         app.*
    Regex         _logType ^(audit|app|(worker|delivery|webhook_delivery|retention-gc|audit-anchor-publisher|outbox)\..*)$

# ─── OUTPUT DESTINATIONS ───────────────────────────────
# Uncomment the output(s) you want. Multiple outputs are supported.

# --- Default: stdout (for testing/debugging) ---
[OUTPUT]
    Name          stdout
    Match         app.*
    Format        json_lines

