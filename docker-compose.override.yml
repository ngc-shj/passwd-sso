# Development overrides - automatically merged with docker-compose.yml
# This file exposes ports for local development.
# Do NOT use in production.

# Repeated from docker-compose.yml — YAML anchors do not cross compose files.
# See the comment there for why the cap exists and why it is this size.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  db:
    logging: *default-logging
    ports:
      - "127.0.0.1:5432:5432"

  jackson:
    logging: *default-logging
    ports:
      - "127.0.0.1:5225:5225"

  redis:
    logging: *default-logging
    ports:
      - "127.0.0.1:6379:6379"

  audit-outbox-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: deps
    volumes:
      - .:/app
      - /app/node_modules
    env_file:
      # See docker-compose.yml app service for the .env vs .env.local note.
      - .env
    environment:
      - OUTBOX_WORKER_DATABASE_URL=postgresql://passwd_outbox_worker:${PASSWD_OUTBOX_WORKER_PASSWORD:?PASSWD_OUTBOX_WORKER_PASSWORD is required}@db:5432/passwd_sso
      # Least-privilege: connect ONLY via the scoped worker role. Blank out the
      # broad app DATABASE_URL that env_file: .env would otherwise inject (the
      # worker schema normalizes empty → unset and uses the dedicated URL). This
      # mirrors production, so a regression that reintroduces the app credential
      # is caught in dev.
      - DATABASE_URL=
    depends_on:
      db:
        condition: service_healthy
      migrate:
        # migrate is profile-gated (profiles: ["migrate"] in docker-compose.yml).
        # required: false makes this dependency optional — Compose only waits
        # for migrate when the migrate profile is active (e.g. via `docker
        # compose --profile migrate up`). Without it, Compose v2.20+ rejects
        # the project as "service depends on undefined service: migrate".
        condition: service_completed_successfully
        required: false
    command: ["npx", "tsx", "scripts/audit-outbox-worker.ts"]
    restart: unless-stopped
    logging: *default-logging
    networks:
      - internal

  retention-gc-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: deps
    container_name: passwd-sso-retention-gc-worker
    volumes:
      - .:/app
      - /app/node_modules
    env_file:
      # See docker-compose.yml app service for the .env vs .env.local note.
      - .env
    environment:
      - RETENTION_GC_DATABASE_URL=postgresql://passwd_retention_gc_worker:${PASSWD_RETENTION_GC_WORKER_PASSWORD:?PASSWD_RETENTION_GC_WORKER_PASSWORD is required}@db:5432/passwd_sso
      # Least-privilege: connect ONLY via the scoped worker role. Blank out the
      # broad app DATABASE_URL that env_file: .env would otherwise inject (the
      # worker schema normalizes empty → unset and uses the dedicated URL). This
      # mirrors production, so a regression that reintroduces the app credential
      # is caught in dev.
      - DATABASE_URL=
    depends_on:
      db:
        condition: service_healthy
      migrate:
        # migrate is profile-gated (profiles: ["migrate"] in docker-compose.yml).
        # required: false makes this dependency optional — Compose only waits
        # for migrate when the migrate profile is active (e.g. via `docker
        # compose --profile migrate up`). Without it, Compose v2.20+ rejects
        # the project as "service depends on undefined service: migrate".
        condition: service_completed_successfully
        required: false
    command: ["npx", "tsx", "scripts/retention-gc-worker.ts"]
    restart: unless-stopped
    logging: *default-logging
    networks:
      - internal

  # Isolated on a network of its own, and reached only over the published
  # loopback ports.
  #
  # mailpit's web UI and REST API are unauthenticated by design, and what they
  # serve is every captured message — magic-link sign-in tokens, team and
  # emergency-access invitations. So the question is who can reach 8025.
  #
  # Today the answer is already "nobody on `internal`", but by OMISSION: with no
  # `networks:` key a service falls to compose's `default`, and mailpit happens
  # to be the only member. That is a property of what has not been written yet,
  # not a boundary — the next service added without a `networks:` key lands on
  # `default` beside it, silently. Naming a network mailpit does not share makes
  # the isolation something the file states rather than something it implies.
  #
  # Deliberately a network of ONE. `SMTP_HOST=localhost` / `SMTP_PORT=1025`: the
  # only consumer reaches mailpit through the published loopback port, never by
  # compose hostname (`grep -rn 'mailpit:1025\|mailpit:8025\|http://mailpit'`
  # over the tree finds no caller). Adding `app` here would hand a container a
  # route to that unauthenticated UI which it does not have today — widening the
  # reach in the name of restricting it.
  mailpit:
    # Pinned like its siblings (jackson, minio), and to a version chosen from the
    # advisory list rather than from whatever was running. `latest` resolved to
    # v1.29.1 here, which sits inside the vulnerable range of TEN advisories —
    # among them CVE-2026-45713 (High, unauthenticated SMTP/HTTP
    # memory-exhaustion DoS) and CVE-2026-67448, a WebSocket origin-check bypass
    # that lets any page open in the developer's browser read every captured
    # message. That is the same magic-link exposure the network split above
    # removes, arriving through the loopback port it deliberately keeps.
    #
    # TEN NEEDS TWO SOURCES, which is why both commands are here. mailpit
    # publishes some advisories only on its own repository; they never reach the
    # global database, so a single query answers eight and looks complete. Three
    # independent reviewers re-derived this from the global query alone and each
    # got eight — the count is not wrong, the one-source recipe was.
    #
    #   # 8 of 13 — the global advisory database
    #   gh api '/advisories?ecosystem=go&affects=github.com/axllent/mailpit' \
    #     --jq '.[]|{cve:.cve_id,sev:.severity,pub:.published_at,
    #                r:(.vulnerabilities[]|select(.package.name|test("mailpit"))
    #                   |.vulnerable_version_range),
    #                p:(.vulnerabilities[]|select(.package.name|test("mailpit"))
    #                   |.first_patched_version)}'
    #   # + 2 repository-only: CVE-2026-67446, CVE-2026-67445 (both 1.30.4)
    #   gh api repos/axllent/mailpit/security-advisories \
    #     --jq '.[]|{cve:.cve_id,sev:.severity,pub:.published_at}'
    #
    # `vulnerable_version_range` is the field that decides whether a RUNNING
    # version is affected; filtering on `first_patched_version` instead admits
    # CVE-2026-67447 (>= 1.30.0), which never touched v1.29.1.
    #
    # 1.30.6 is the lowest release clearing all ten. v1.31.0 (released
    # 2026-08-22) postdates every advisory on both clocks, but state the margin
    # on the conservative one: the newest advisory is CVE-2026-67448, published
    # 2026-07-28 on the repository and ingested into the global database
    # 2026-08-20 — so the pin leads the frontier by 2 days, not by 25.
    #
    # Re-derive before bumping; a pin freezes whatever was unpatched the day it
    # was written. A `gh` that is unauthenticated or rate-limited returns an
    # empty array, which reads exactly like a clean bill — check the exit status,
    # not just the output.
    image: axllent/mailpit:v1.31.0
    ports:
      - "127.0.0.1:1025:1025"   # SMTP
      - "127.0.0.1:8025:8025"   # Web UI
    logging: *default-logging
    networks:
      - mail

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    # No persistent volume: ephemeral storage for dev/test only
    logging: *default-logging
    networks:
      - internal

networks:
  # mailpit only. Compose MERGES this map with the base file's, so `internal`
  # is still defined — declaring `mail` here adds a second network rather than
  # replacing the first.
  #
  # NOT `internal: true`, and the reason is measured rather than assumed. It does
  # block mailpit's egress — which is desirable, since the container accumulates
  # live magic-link sign-in tokens — but on this Docker it also stops the daemon
  # from publishing the ports at all: with `internal: true` set, `docker port
  # passwd-sso-mailpit-1` prints nothing, the host has no LISTEN on 8025/1025,
  # and mailpit becomes unreachable from the host while reporting healthy
  # inside. That is the whole dev mail workflow, traded for an egress path
  # nothing has been shown to use. If a future Docker separates the two, re-test
  # BOTH sides before adopting it: egress blocked AND `curl 127.0.0.1:8025`
  # answering 200.
  #
  # NOTE for a host that ran the pre-`mail` config: mailpit used to fall to
  # compose's implicit `default`, and nothing declares `default` any more — so
  # `docker compose down` will not reclaim it. Remove the empty bridge once:
  #   docker network rm passwd-sso_default
  # (It refuses while a container is attached, so it is safe to run blind. On a
  # host that never ran the old config it simply exits non-zero.)
  mail:
    driver: bridge
