# Container log caps.
#
# Docker's default json-file driver has NO rotation limit. A service stuck in a
# per-second retry loop writes until the disk fills — a single misconfigured DB
# role produced 4.5 GB across two containers in 27 hours on the dev host, and
# nothing bounded it. The cap makes the worst case a function of the container
# count, not of how long the failure goes unnoticed.
#
# 20m x 5 is deliberately generous rather than minimal, because two of these
# streams are forensically load-bearing:
#
#   - app stdout carries the synchronous audit line (_logType "audit") — but
#     only when AUDIT_LOG_FORWARD=true, which .env.example ships as false and
#     only docker-compose.logging.yml sets, and that overlay moves app off
#     json-file onto fluentd. So the cap governs it in no shipped config.
#   - app and worker stdout always carry deadLetterLogger (_logType
#     "audit-dead-letter", src/lib/audit/audit-logger.ts:93-96) — the record of
#     an audit event that never reached audit_outbox. Most have a durable
#     AUDIT_OUTBOX_DEAD_LETTER row behind them, so rotation costs alerting
#     latency rather than the record; the exception is the app-side
#     tenant_not_found path (src/lib/audit/audit.ts:259-264), which returns
#     without enqueuing anything, making stdout the only copy.
#
# docker-compose.logging.yml ships the APP stream off-host, but do not read that
# as a way to retain dead-letters past the rotation window: its Fluent Bit filter
# excludes `_logType ^audit-dead-letter$`, so those records are dropped
# before any output sees them. It also defines no worker services. Both halves of
# that stream therefore stay host-local and bounded by this cap.
#
# YAML anchors do not cross compose files, so each overlay repeats this block
# for the services it defines. Nothing in YAML enforces that — the gate is
# scripts/checks/check-compose-log-caps.mjs, run by scripts/pre-pr.sh.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Dummy URL for prisma generate (no actual DB connection at build time).
        # Do NOT use real credentials here — build args are visible in image metadata.
        DATABASE_URL: postgresql://build:build@localhost:5432/passwd_sso
    ports:
      - "3000:3000"
    env_file:
      # Canonical env file. Created by `npm run init:env` or by manual edit
      # of `.env.example`. Docker Compose auto-loads .env from the project
      # root for ${VAR} substitution AND for env_file injection here.
      # `.env.local` (Next.js per-developer override) is NOT injected into
      # the container — overrides only apply to the host-side `npm run dev`
      # path through src/lib/load-env.ts.
      - .env
    environment:
      - DATABASE_URL=postgresql://passwd_app:${PASSWD_APP_PASSWORD:?PASSWD_APP_PASSWORD is required}@db:5432/passwd_sso
      - JACKSON_URL=http://jackson:5225
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379
    depends_on:
      db:
        condition: service_healthy
      jackson:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    networks:
      - internal

  db:
    image: postgres:16-alpine
    environment:
      # SUPERUSER role for migrations + Jackson; bootstraps the postgres image.
      POSTGRES_USER: passwd_user
      POSTGRES_PASSWORD: ${PASSWD_SUPERUSER_PASSWORD:?PASSWD_SUPERUSER_PASSWORD is required}
      POSTGRES_DB: passwd_sso
      # Forwarded to infra/postgres/initdb/* scripts via \getenv so the
      # least-privilege roles are created with the operator-supplied
      # passwords on first boot.
      PASSWD_APP_PASSWORD: ${PASSWD_APP_PASSWORD:?PASSWD_APP_PASSWORD is required}
      PASSWD_OUTBOX_WORKER_PASSWORD: ${PASSWD_OUTBOX_WORKER_PASSWORD:?PASSWD_OUTBOX_WORKER_PASSWORD is required}
      PASSWD_RETENTION_GC_WORKER_PASSWORD: ${PASSWD_RETENTION_GC_WORKER_PASSWORD:?PASSWD_RETENTION_GC_WORKER_PASSWORD is required}
      PASSWD_JACKSON_PASSWORD: ${PASSWD_JACKSON_PASSWORD:?PASSWD_JACKSON_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U passwd_user -d passwd_sso"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging: *default-logging
    networks:
      - internal
    # Do NOT expose port 5432 to host in production

  jackson:
    image: boxyhq/jackson:1.52.2
    environment:
      JACKSON_API_KEYS: ${JACKSON_API_KEY:?JACKSON_API_KEY is required}
      DB_ENGINE: sql
      DB_TYPE: postgres
      DB_URL: postgresql://jackson_user:${PASSWD_JACKSON_PASSWORD:?PASSWD_JACKSON_PASSWORD is required}@db:5432/jackson
      NEXTAUTH_URL: http://localhost:5225
      EXTERNAL_URL: http://localhost:5225
      NEXTAUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required}
      NEXTAUTH_ACL: "*"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"const http=require('http');const os=require('os');http.get('http://'+os.hostname()+':5225/api/health',r=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))\"",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped
    logging: *default-logging
    networks:
      - internal
    # Do NOT expose port 5225 to host in production

  migrate:
    profiles: ["migrate"]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DATABASE_URL: postgresql://build:build@localhost:5432/passwd_sso
    environment:
      # MIGRATION_DATABASE_URL is the canonical name for the SUPERUSER URL
      # used by Prisma CLI (see prisma.config.ts); matches .env.example.
      - MIGRATION_DATABASE_URL=postgresql://passwd_user:${PASSWD_SUPERUSER_PASSWORD:?PASSWD_SUPERUSER_PASSWORD is required}@db:5432/passwd_sso
    depends_on:
      db:
        condition: service_healthy
    command: ["npx", "prisma", "migrate", "deploy"]
    restart: "no"
    logging: *default-logging
    networks:
      - internal

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    environment:
      # redis-cli reads REDISCLI_AUTH so the password is not exposed in healthcheck argv.
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    logging: *default-logging
    networks:
      - internal

volumes:
  postgres_data:
  redis_data:

networks:
  internal:
    driver: bridge
